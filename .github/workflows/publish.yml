# Added workflow_dispatch to allow manual re-renders/publishing during GitHub Actions push-webhook outages.
# To run manually:
#   - From GitHub: Go to the "Actions" tab -> click "Render and Publish" in the sidebar -> click "Run workflow" (branch main).
#   - From CLI: gh workflow run publish.yml --ref main
on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Render and Publish

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Quarto
              uses: quarto-dev/quarto-actions/setup@v2
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tinytex: true

            - name: Render
              uses: quarto-dev/quarto-actions/render@v2
              with:
                path: docs

            - name: Publish to GitHub Pages
              uses: quarto-dev/quarto-actions/publish@v2
              with:
                target: gh-pages
                path: docs/src
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}