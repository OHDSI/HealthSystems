project:
  type: website
  output-dir: src
  preview:
    port: 8000
  
highlight-style: ayu
code-annotations: hover


website:
  title: "OHDSI HSIG"
  
  # search
  search:
    location: navbar
    type: overlay
  
  # nav
  navbar:
    logo: logo.svg
    
    tools:
      - icon: github
        menu:
          - text: HSIG Repo
            url: https://github.com/OHDSI/HealthSystems
          - text: OHDSI GitHub
            url: https://github.com/OHDSI

    left:
      - href: index.qmd
        text: Home
      - href: getting-started/getting-started.qmd
        text: Getting Started
      - sidebar:community
      - sidebar:etl-mapping
      - href: resources.qmd
        text: Resources

    right:
      - sidebar:contribute

  sidebar:
    - id: ""
    - id: community
      title: "Community"
      style: "docked"
      collapse-level: 2
      contents:
        - community/get-involved.qmd
        - community/presentations.qmd
    - id: etl-mapping
      title: "ETL & Mapping Guidance"
      style: "docked"
      collapse-level: 2
      contents:
        - etl-mapping/overview.qmd
        - etl-mapping/ehr-source-systems.qmd
        - etl-mapping/terminology-mapping/terminology-mapping.qmd
        - etl-mapping/terminology-mapping/converting_ndc.qmd
        - etl-mapping/data-governance.qmd
    - id: contribute
      title: "Contribute"
      style: "docked"
      collapse-level: 2
      contents:
        - contribute/submit_mappings.qmd
  
  
  
  # footer
  page-footer:
    border: false
    left: "© 2024 Observational Health Data Sciences and Informatics"
    right:
      - text: '{{< iconify mdi:github>}}'
        href: https://github.com/OHDSI/
      - text: '{{< iconify mdi:youtube>}}'
        href: https://www.youtube.com/c/OHDSI
      - text: '{{< iconify mdi:twitter>}}'
        href: https://twitter.com/OHDSI
      - text: '{{< iconify mdi:linkedin>}}'
        href: https://www.linkedin.com/company/ohdsi

        
format:
  html:
    theme:
      light: [flatly, "ohdsi-light.scss"]
      dark: [darkly, "ohdsi-dark.scss"]
    toc: true
    css: styles.css
    include-in-header:
      - text: |
          <script data-goatcounter="https://hestia.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

execute:
  freeze: auto